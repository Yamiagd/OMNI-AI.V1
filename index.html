<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNI AI – Black Hole Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    /* space background */
    #space {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 30% 40%, #0a0e1a, #000000);
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    /* HIGH-QUALITY LOADING – solar system orbit */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      transition: opacity 1s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .solar-system {
      position: relative;
      width: 300px;
      height: 300px;
    }
    .sun {
      position: absolute;
      top: 50%; left: 50%;
      width: 60px; height: 60px;
      background: radial-gradient(circle, #89CFF0, #1a3a5a);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 80px rgba(137,207,240,0.8), 0 0 160px rgba(137,207,240,0.4);
      z-index: 2;
    }
    .orbit-ring {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 1px solid rgba(137,207,240,0.15);
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }
    .orbit-ring:nth-child(2) { width: 80%; height: 80%; top: 10%; left: 10%; animation-duration: 30s; border-color: rgba(255,255,255,0.08); }
    .orbit-ring:nth-child(3) { width: 60%; height: 60%; top: 20%; left: 20%; animation-duration: 15s; animation-direction: reverse; border-color: rgba(255,59,48,0.1); }
    .planet {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #89CFF0);
      box-shadow: 0 0 20px rgba(137,207,240,0.6);
    }
    .planet.p1 { width: 12px; height: 12px; top: -6px; left: 50%; transform: translateX(-50%); background: #FF3B30; box-shadow: 0 0 30px #FF3B30; }
    .planet.p2 { width: 18px; height: 18px; bottom: -9px; right: 10%; background: #89CFF0; box-shadow: 0 0 25px #89CFF0; }
    .planet.p3 { width: 10px; height: 10px; top: 25%; left: -5px; background: #FFFFFF; box-shadow: 0 0 20px #FFFFFF; }
    .planet.p4 { width: 14px; height: 14px; bottom: 20%; right: -7px; background: #a0c0e0; box-shadow: 0 0 15px #a0c0e0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-text-load {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #FFFFFF;
      text-shadow: 0 0 30px rgba(137,207,240,0.9), 0 0 80px rgba(137,207,240,0.5);
      font-family: 'Arial Black', sans-serif;
      text-transform: uppercase;
      margin-top: 30px;
      z-index: 5;
    }
    .logo-text-load span { color: #FF3B30; }
    #progress-bar {
      margin-top: 25px;
      width: 260px;
      height: 4px;
      background: #1a1f2e;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(137,207,240,0.2);
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #89CFF0, #FFFFFF, #FF3B30);
      border-radius: 4px;
      animation: load 3s ease-in-out forwards;
    }
    @keyframes load {
      0% { width: 0%; }
      70% { width: 80%; }
      100% { width: 100%; }
    }
    #status {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      margin-top: 14px;
      letter-spacing: 3px;
      font-weight: 300;
    }

    /* MAIN UI after loading */
    #main-ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    #main-ui.active { display: flex; }

    /* Black Hole / Supernova core */
    #core-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 30px;
    }
    #black-hole {
      position: absolute;
      top: 50%; left: 50%;
      width: 160px; height: 160px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 30% 30%, #1a2a3a, #000000 70%);
      border-radius: 50%;
      box-shadow: 0 0 100px rgba(137,207,240,0.2), inset 0 0 60px rgba(0,0,0,0.9);
      border: 2px solid rgba(137,207,240,0.3);
      transition: all 0.3s;
      z-index: 2;
    }
    /* accretion disk – animated rings */
    .accretion {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(137,207,240,0.15);
      animation: spin-accretion 8s linear infinite;
    }
    .accretion.a1 { width: 200px; height: 200px; border-color: rgba(255,255,255,0.1); animation-duration: 6s; }
    .accretion.a2 { width: 240px; height: 240px; border-color: rgba(255,59,48,0.08); animation-duration: 10s; animation-direction: reverse; }
    .accretion.a3 { width: 270px; height: 270px; border-color: rgba(137,207,240,0.05); animation-duration: 14s; }
    @keyframes spin-accretion { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* pulsing glow when typing */
    #black-hole.typing {
      box-shadow: 0 0 120px rgba(137,207,240,0.8), 0 0 200px rgba(137,207,240,0.4), inset 0 0 80px #89CFF0;
      border-color: #89CFF0;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* response text above core */
    #response-text {
      color: #FFFFFF;
      font-size: 1.2rem;
      text-align: center;
      max-width: 600px;
      padding: 16px 24px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      border: 1px solid rgba(137,207,240,0.15);
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-weight: 300;
      letter-spacing: 0.5px;
      transition: 0.3s;
    }

    /* Mode buttons */
    #mode-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }
    .mode-btn {
      padding: 12px 28px;
      border-radius: 50px;
      border: 1px solid rgba(137,207,240,0.3);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(137,207,240,0.05);
      font-family: inherit;
    }
    .mode-btn:hover {
      background: rgba(137,207,240,0.15);
      border-color: #89CFF0;
      transform: scale(1.03);
    }
    .mode-btn.active {
      background: #89CFF0;
      color: #000;
      border-color: #89CFF0;
      box-shadow: 0 0 40px rgba(137,207,240,0.3);
    }
    .mode-btn .badge {
      display: block;
      font-size: 0.65rem;
      font-weight: 300;
      opacity: 0.7;
      margin-top: 3px;
    }
    .mode-btn.active .badge { opacity: 0.9; }

    /* chat input – same as before but repositioned */
    #chat-ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      z-index: 20;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(137,207,240,0.25);
      border-radius: 30px;
      padding: 6px 6px 6px 24px;
      box-shadow: 0 0 40px rgba(137,207,240,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 1rem;
      padding: 12px 0;
      font-family: inherit;
    }
    #chat-input::placeholder {
      color: rgba(255,255,255,0.3);
      font-weight: 300;
    }
    #chat-send {
      background: #89CFF0;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(137,207,240,0.2);
    }
    #chat-send:hover {
      background: #FFFFFF;
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      .solar-system { width: 220px; height: 220px; }
      .sun { width: 40px; height: 40px; }
      .logo-text-load { font-size: 2.2rem; }
      #core-container { width: 200px; height: 200px; }
      #black-hole { width: 110px; height: 110px; }
      .accretion.a1 { width: 150px; height: 150px; }
      .accretion.a2 { width: 180px; height: 180px; }
      .accretion.a3 { width: 200px; height: 200px; }
      #response-text { font-size: 1rem; min-height: 60px; }
      .mode-btn { padding: 8px 16px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div id="space"></div>

  <!-- LOADING SCREEN – high quality solar system -->
  <div id="loader">
    <div class="solar-system">
      <div class="sun"></div>
      <div class="orbit-ring"><div class="planet p1"></div></div>
      <div class="orbit-ring"><div class="planet p2"></div></div>
      <div class="orbit-ring"><div class="planet p3"></div></div>
      <div class="orbit-ring" style="width:50%;height:50%;top:25%;left:25%;animation-duration:12s;"><div class="planet p4"></div></div>
    </div>
    <div class="logo-text-load">OM<span>N</span>I</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status">CALIBRATING GRAVITATIONAL LENS...</div>
  </div>

  <!-- MAIN UI after loading -->
  <div id="main-ui">
    <div id="core-container">
      <div class="accretion a1"></div>
      <div class="accretion a2"></div>
      <div class="accretion a3"></div>
      <div id="black-hole"></div>
    </div>
    <div id="response-text">OMNI core online. Ask anything.</div>
    <div id="mode-bar">
      <button class="mode-btn" data-mode="fast">⚡ Fast <span class="badge">10‑15s · somewhat fails</span></button>
      <button class="mode-btn active" data-mode="smart">🧠 Smartest <span class="badge">30‑60s · most accurate</span></button>
      <button class="mode-btn" data-mode="instant">💨 Instant <span class="badge">1‑5s · may be inaccurate</span></button>
    </div>
  </div>

  <!-- Chat input -->
  <div id="chat-ui">
    <input type="text" id="chat-input" placeholder="Ask OMNI..." autofocus>
    <button id="chat-send">➤</button>
  </div>

  <script>
    (function() {
      // Stars
      const space = document.getElementById('space');
      for (let i = 0; i < 220; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.8 + 0.4;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 4) + 's';
        star.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
        space.appendChild(star);
      }

      // DOM refs
      const loader = document.getElementById('loader');
      const mainUI = document.getElementById('main-ui');
      const blackHole = document.getElementById('black-hole');
      const responseText = document.getElementById('response-text');
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const statusText = document.getElementById('status');
      const modeBtns = document.querySelectorAll('.mode-btn');

      let currentMode = 'smart'; // fast, smart, instant
      let isProcessing = false;
      let typingInterval = null;

      // Mode selection
      modeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          modeBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMode = this.dataset.mode;
          // update placeholder hint
          const hints = {
            fast: 'Fast (10-15s) – ask anything',
            smart: 'Smartest (30-60s) – deep analysis',
            instant: 'Instant (1-5s) – quick guess'
          };
          input.placeholder = hints[currentMode] || 'Ask OMNI...';
        });
      });
      // set default placeholder
      input.placeholder = 'Smartest (30-60s) – deep analysis';

      // Simulate loading
      setTimeout(() => {
        loader.classList.add('hidden');
        mainUI.classList.add('active');
        statusText.textContent = 'OMNI ONLINE – SINGULARITY ACTIVE';
        input.focus();
      }, 3500); // matches progress bar ~3s + delay

      // Core typing animation – pulse black hole
      function startTyping() {
        if (typingInterval) return;
        blackHole.classList.add('typing');
        // also rotate accretion faster
        document.querySelectorAll('.accretion').forEach(a => {
          a.style.animationDuration = (parseFloat(a.style.animationDuration) || 8) * 0.6 + 's';
        });
        // change response text to "thinking..."
        responseText.innerHTML = '⚡ <span style="opacity:0.7;">processing...</span>';
      }

      function stopTyping() {
        blackHole.classList.remove('typing');
        document.querySelectorAll('.accretion').forEach(a => {
          // revert to original durations (hardcoded in CSS, we'll just reset)
          a.style.animationDuration = '';
        });
        if (typingInterval) {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }

      // simulate response with timing based on mode
      function generateResponse(query) {
        const mode = currentMode;
        let delay = 0;
        let accuracy = 1.0;
        let response = '';

        if (mode === 'instant') {
          delay = 1000 + Math.random() * 4000; // 1-5s
          accuracy = 0.6 + Math.random() * 0.3; // 60-90%
          const answers = [
            'Quick estimate: ' + query.split(' ').reverse().join(' ') + ' (may be off)',
            'Instant inference: ' + query.length + ' characters processed.',
            'Fast path: likely answer is ' + (Math.random() > 0.5 ? 'yes' : 'no') + ' (confidence ' + Math.round(accuracy*100) + '%)'
          ];
          response = answers[Math.floor(Math.random() * answers.length)];
        } else if (mode === 'fast') {
          delay = 10000 + Math.random() * 5000; // 10-15s
          accuracy = 0.85 + Math.random() * 0.1; // 85-95%
          response = '⚡ Fast analysis: "' + query + '" → based on aggregated heuristics, result = ' + 
                     (query.length % 2 === 0 ? 'positive' : 'negative') + 
                     ' (accuracy ~' + Math.round(accuracy*100) + '%)';
        } else { // smart
          delay = 30000 + Math.random() * 30000; // 30-60s
          accuracy = 0.95 + Math.random() * 0.05; // 95-100%
          response = '🧠 Deep reasoning on "' + query + '": after full neural traversal, optimal solution is ' +
                     'to proceed with multi‑factor decision. Confidence ' + Math.round(accuracy*100) + '%.';
        }

        return { delay, response, accuracy };
      }

      function handleQuery() {
        const msg = input.value.trim();
        if (!msg || isProcessing) return;
        isProcessing = true;
        input.disabled = true;
        sendBtn.disabled = true;

        // start typing animation
        startTyping();

        const { delay, response, accuracy } = generateResponse(msg);
        // show a live updating "thinking" effect – change dots
        let dotCount = 0;
        typingInterval = setInterval(() => {
          dotCount = (dotCount + 1) % 4;
          const dots = '.'.repeat(dotCount);
          responseText.innerHTML = '⚡ <span style="opacity:0.7;">processing' + dots + '</span>';
        }, 400);

        // after delay, show response
        setTimeout(() => {
          stopTyping();
          // show response with small accuracy note
          const accNote = (accuracy < 0.8) ? ' ⚠️ low confidence' : (accuracy > 0.95 ? ' ✅ high confidence' : '');
          responseText.textContent = response + accNote;
          isProcessing = false;
          input.disabled = false;
          sendBtn.disabled = false;
          input.value = '';
          input.focus();
        }, delay);
      }

      sendBtn.addEventListener('click', handleQuery);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleQuery();
      });

      // Also allow clicking on black hole to abort? Not needed.
      // Cleanup on page unload
      window.addEventListener('beforeunload', function() {
        if (typingInterval) clearInterval(typingInterval);
      });

      // extra: change core color based on mode? not required.
    })();
  </script>
</body>
</html>
