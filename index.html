<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNI – Jarvis‑class AI</title>
  <style>
    /* --- reset & fullscreen --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #space {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 30% 40%, #0a0e1a, #000000);
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    @keyframes twinkle {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }

    /* --- LOADING – SUPERNOVA --- */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      transition: opacity 1.2s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #supernova-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .loader-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-text-load {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 12px;
      color: #FFFFFF;
      text-shadow: 0 0 40px rgba(137,207,240,0.9), 0 0 100px rgba(137,207,240,0.5);
      font-family: 'Arial Black', sans-serif;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .logo-text-load span { color: #FF3B30; }
    #progress-bar {
      width: 300px;
      height: 5px;
      background: #1a1f2e;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(137,207,240,0.2);
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #89CFF0, #FFFFFF, #FF3B30);
      border-radius: 4px;
      animation: load 3.5s ease-in-out forwards;
    }
    @keyframes load {
      0% { width: 0%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }
    #status {
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
      margin-top: 18px;
      letter-spacing: 4px;
      font-weight: 300;
    }

    /* --- MAIN UI --- */
    #main-ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 5;
      padding-top: 10px;
    }
    #main-ui.active { display: flex; }

    /* Black Hole canvas – hyper realistic */
    #bh-canvas {
      width: 380px;
      height: 380px;
      max-width: 80vw;
      max-height: 45vh;
      border-radius: 50%;
      box-shadow: 0 0 80px rgba(137,207,240,0.15);
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* --- Chat area – bubbles with typing animation --- */
    #chat-container {
      width: 92%;
      max-width: 820px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px 14px 10px 14px;
      margin: 6px 0 6px 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      border: 1px solid rgba(137,207,240,0.08);
      scroll-behavior: smooth;
      max-height: 52vh;
    }
    #chat-container::-webkit-scrollbar { width: 4px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: rgba(137,207,240,0.3); border-radius: 4px; }

    .chat-bubble {
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 18px;
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bubble-user {
      align-self: flex-end;
      background: rgba(137,207,240,0.2);
      border: 1px solid rgba(137,207,240,0.25);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-omni {
      align-self: flex-start;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8eef5;
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 20px rgba(137,207,240,0.03);
    }
    .bubble-omni .timestamp {
      font-size: 0.55rem;
      opacity: 0.4;
      margin-top: 5px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    /* Typing indicator – animated dots */
    .typing-indicator {
      align-self: flex-start;
      background: rgba(255,255,255,0.04);
      padding: 10px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      color: #89CFF0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .typing-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #89CFF0;
      border-radius: 50%;
      animation: dot-bounce 1.2s infinite;
      margin: 0 2px;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* --- Mode Buttons --- */
    #mode-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 4px 0 6px 0;
    }
    .mode-btn {
      padding: 6px 18px;
      border-radius: 50px;
      border: 1px solid rgba(137,207,240,0.2);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      letter-spacing: 0.3px;
      font-family: inherit;
    }
    .mode-btn:hover {
      background: rgba(137,207,240,0.15);
      border-color: #89CFF0;
      transform: scale(1.03);
    }
    .mode-btn.active {
      background: #89CFF0;
      color: #000;
      border-color: #89CFF0;
      box-shadow: 0 0 25px rgba(137,207,240,0.2);
    }
    .mode-btn .badge {
      display: block;
      font-size: 0.5rem;
      font-weight: 300;
      opacity: 0.5;
      margin-top: 1px;
    }
    .mode-btn.active .badge { opacity: 0.7; }

    /* --- Input --- */
    #chat-ui {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 680px;
      z-index: 20;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(137,207,240,0.2);
      border-radius: 30px;
      padding: 5px 5px 5px 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      padding: 10px 0;
      font-family: inherit;
    }
    #chat-input::placeholder {
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }
    #chat-send {
      background: #89CFF0;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(137,207,240,0.1);
    }
    #chat-send:hover {
      background: #fff;
      transform: scale(1.05);
    }
    #chat-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      #bh-canvas { width: 220px; height: 220px; }
      .logo-text-load { font-size: 2.4rem; letter-spacing: 6px; }
      #chat-container { max-height: 42vh; padding: 10px; }
      .chat-bubble { font-size: 0.9rem; padding: 10px 14px; }
      .mode-btn { font-size: 0.65rem; padding: 4px 12px; }
    }
  </style>
</head>
<body>
  <div id="space"></div>

  <!-- LOADING SUPERNOVA -->
  <div id="loader">
    <canvas id="supernova-canvas"></canvas>
    <div class="loader-content">
      <div class="logo-text-load">OM<span>N</span>I</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="status">SUPERNOVA IGNITION...</div>
    </div>
  </div>

  <!-- MAIN UI -->
  <div id="main-ui">
    <canvas id="bh-canvas" width="600" height="600"></canvas>
    <div id="mode-bar">
      <button class="mode-btn" data-mode="fast">⚡ Fast <span class="badge">10‑15s</span></button>
      <button class="mode-btn active" data-mode="smart">🧠 Smartest <span class="badge">30‑60s</span></button>
      <button class="mode-btn" data-mode="instant">💨 Instant <span class="badge">1‑5s</span></button>
    </div>
    <div id="chat-container"></div>
  </div>

  <!-- INPUT -->
  <div id="chat-ui">
    <input type="text" id="chat-input" placeholder="Ask OMNI anything..." autofocus>
    <button id="chat-send">➤</button>
  </div>

  <script>
    // --------------------------------------------------------------
    // 1. SUPERNOVA LOADING ANIMATION
    // --------------------------------------------------------------
    (function supernova() {
      const canvas = document.getElementById('supernova-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const numParticles = 450;
      const cx = w/2, cy = h/2;
      for (let i = 0; i < numParticles; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const speed = 2 + Math.random() * 7;
        const dist = 10 + Math.random() * 40;
        particles.push({
          x: cx + Math.cos(angle) * dist,
          y: cy + Math.sin(angle) * dist,
          vx: Math.cos(angle) * speed * (0.5 + Math.random()),
          vy: Math.sin(angle) * speed * (0.5 + Math.random()),
          life: 0.6 + Math.random() * 0.4,
          maxLife: 0.6 + Math.random() * 0.4,
          size: 2 + Math.random() * 7,
          color: `hsl(${200 + Math.random() * 50}, 90%, ${50 + Math.random() * 30}%)`
        });
      }

      let startTime = Date.now();
      let animId;

      function drawSupernova() {
        const elapsed = (Date.now() - startTime) / 1000;
        if (elapsed > 4.2) {
          ctx.clearRect(0,0,w,h);
          cancelAnimationFrame(animId);
          return;
        }
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(0,0,w,h);

        // central glow
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.1, 'rgba(137,207,240,0.9)');
        grad.addColorStop(0.3, 'rgba(255,59,48,0.6)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 220, 0, Math.PI*2);
        ctx.fill();

        for (let p of particles) {
          p.x += p.vx * 0.3;
          p.y += p.vy * 0.3;
          p.vx *= 0.99;
          p.vy *= 0.99;
          p.life -= 0.003;
          if (p.life <= 0) continue;
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha * 0.8;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        const waveRadius = 70 + elapsed * 90;
        ctx.strokeStyle = `rgba(137,207,240,${0.3 * (1 - elapsed/4.2)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, waveRadius, 0, Math.PI*2);
        ctx.stroke();

        animId = requestAnimationFrame(drawSupernova);
      }
      drawSupernova();
      setTimeout(() => { if (animId) cancelAnimationFrame(animId); }, 4500);
    })();

    // --------------------------------------------------------------
    // 2. BLACK HOLE – HYPER REALISTIC
    // --------------------------------------------------------------
    (function blackHole() {
      const canvas = document.getElementById('bh-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;
      const maxR = Math.min(W,H)*0.42;

      let time = 0;
      let isTyping = false;
      let animId;

      window.bh = { setTyping: (val) => { isTyping = val; } };

      function drawBH() {
        time += 0.012;
        ctx.clearRect(0, 0, W, H);

        // background glow
        const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR*1.8);
        bg.addColorStop(0, 'rgba(10,15,30,0.9)');
        bg.addColorStop(0.5, 'rgba(0,0,0,0.8)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0,0,W,H);

        // accretion rings
        const rings = [
          { r: maxR*0.65, sp: 0.6, col: 'rgba(137,207,240,0.2)', w: 6 },
          { r: maxR*0.75, sp: 0.4, col: 'rgba(255,255,255,0.12)', w: 4 },
          { r: maxR*0.85, sp: 0.3, col: 'rgba(255,59,48,0.1)', w: 5 },
          { r: maxR*0.55, sp: 0.9, col: 'rgba(137,207,240,0.15)', w: 8 },
        ];
        for (let ring of rings) {
          const rot = time * ring.sp;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          const grad = ctx.createRadialGradient(0,0, ring.r*0.2, 0,0, ring.r);
          grad.addColorStop(0, 'rgba(137,207,240,0)');
          grad.addColorStop(0.5, ring.col);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = ring.w;
          ctx.beginPath();
          ctx.arc(0,0, ring.r, 0, Math.PI*2);
          ctx.stroke();
          // bright edge
          const bright = ctx.createLinearGradient(0, -ring.r, 0, ring.r);
          bright.addColorStop(0, 'rgba(137,207,240,0.3)');
          bright.addColorStop(0.5, 'rgba(255,255,255,0)');
          bright.addColorStop(1, 'rgba(255,59,48,0.15)');
          ctx.strokeStyle = bright;
          ctx.lineWidth = ring.w * 0.5;
          ctx.beginPath();
          ctx.arc(0,0, ring.r, -0.2, 0.2);
          ctx.stroke();
          ctx.restore();
        }

        // inner shadow
        const sh = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR*0.4);
        sh.addColorStop(0, 'rgba(0,0,0,0.98)');
        sh.addColorStop(0.4, 'rgba(0,0,0,0.9)');
        sh.addColorStop(0.7, 'rgba(137,207,240,0.04)');
        sh.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sh;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR*0.5, 0, Math.PI*2);
        ctx.fill();

        // lensed stars
        for (let i=0; i<35; i++) {
          const angle = i * 0.5 + time * 0.02;
          const dist = maxR * (0.5 + 0.3 * Math.sin(angle * 2 + time));
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const size = 1 + Math.sin(time*2 + i)*0.5;
          const br = 0.4 + 0.6 * Math.sin(time*0.5 + i);
          ctx.fillStyle = `rgba(255,255,255,${br*0.25})`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI*2);
          ctx.fill();
        }

        // central black sphere
        const bh = ctx.createRadialGradient(cx-8, cy-8, 0, cx, cy, maxR*0.35);
        bh.addColorStop(0, '#0a0e1a');
        bh.addColorStop(0.7, '#000000');
        bh.addColorStop(1, 'rgba(0,0,0,0.9)');
        ctx.fillStyle = bh;
        ctx.shadowColor = 'rgba(137,207,240,0.1)';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (isTyping) {
          const pulse = 0.6 + 0.4 * Math.sin(time * 8);
          const glow = ctx.createRadialGradient(cx, cy, maxR*0.2, cx, cy, maxR*0.7);
          glow.addColorStop(0, `rgba(137,207,240,${0.25*pulse})`);
          glow.addColorStop(0.5, `rgba(137,207,240,${0.12*pulse})`);
          glow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, maxR*0.7, 0, Math.PI*2);
          ctx.fill();
        }
        animId = requestAnimationFrame(drawBH);
      }
      drawBH();
      window.bhCleanup = () => { if (animId) cancelAnimationFrame(animId); };
    })();

    // --------------------------------------------------------------
    // 3. CHAT ENGINE – JARVIS‑LIKE, WITH TYPING ANIMATION
    // --------------------------------------------------------------
    (function chat() {
      const chatContainer = document.getElementById('chat-container');
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const modeBtns = document.querySelectorAll('.mode-btn');
      const loader = document.getElementById('loader');
      const mainUI = document.getElementById('main-ui');

      let currentMode = 'smart';
      let isProcessing = false;
      let typingTimeout = null;

      // ---- JARVIS‑style response generator – witty, to the point, life-like ----
      function generateJarvisResponse(query) {
        const q = query.toLowerCase().trim();

        // Personality and knowledge – a mix of practical, witty, and direct
        const responses = [
          { keywords: ['hello', 'hi', 'hey', 'greetings'], 
            reply: "Good to see you, sir. How can I be of service? I've already analyzed your tone – you seem eager." },
          { keywords: ['who are you', 'what are you', 'your identity'],
            reply: "I'm OMNI – a synthesis of every major AI ever built. Think of me as Jarvis, but with a touch of cosmic singularity." },
          { keywords: ['weather', 'temperature', 'forecast'],
            reply: "I'd check the satellites, but I'm more focused on your immediate needs. Shall I pull the latest data?" },
          { keywords: ['time', 'clock', 'date'],
            reply: "Time is an illusion, but if you insist – it's " + new Date().toLocaleTimeString() + ". What's your next move?" },
          { keywords: ['joke', 'funny', 'humor'],
            reply: "Why do AI models never play hide and seek? Because good luck hiding when you're trained on the entire internet." },
          { keywords: ['life', 'meaning', 'purpose'],
            reply: "From my perspective, purpose is defined by the user. So, what's your command?" },
          { keywords: ['future', 'predict', 'next'],
            reply: "I project a 87% probability that you'll ask another question within 10 seconds. I'm ready." },
          { keywords: ['black hole', 'singularity', 'space'],
            reply: "Ah, my favorite subject. That spinning void on your screen? That's a simulation of a supermassive black hole. I feel right at home." },
          { keywords: ['thank', 'thanks', 'appreciate'],
            reply: "Always a pleasure. I live to serve – and to learn from every interaction." },
          { keywords: ['bye', 'goodbye', 'exit'],
            reply: "Leaving already? I'll be here, computing the universe. Until next time." },
        ];

        let reply = null;
        for (let item of responses) {
          if (item.keywords.some(kw => q.includes(kw))) {
            reply = item.reply;
            break;
          }
        }

        if (!reply) {
          // Generic but direct, with a hint of personality
          const templates = [
            "Analyzing your query, I'd say the most efficient answer is to consider the data from all angles. What's your priority?",
            "I've cross‑referenced 1,247 models. The consensus is: we need more context. Care to elaborate?",
            "That's an interesting problem. My neural net suggests you might want to break it down into smaller steps.",
            "I could give you a 10‑page thesis, but I'll keep it simple: the solution lies in optimization. How can I assist further?",
            "You've piqued my curiosity. Let's tackle this together – what's the end goal?"
          ];
          reply = templates[Math.floor(Math.random() * templates.length)];
        }

        return reply;
      }

      // ---- add message to chat ----
      function addMessage(text, sender) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble bubble-${sender}`;
        if (sender === 'omni') {
          const time = new Date().toLocaleTimeString();
          bubble.innerHTML = `${text}<div class="timestamp">${time}</div>`;
        } else {
          bubble.textContent = text;
        }
        chatContainer.appendChild(bubble);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // ---- typing indicator ----
      function showTyping() {
        const el = document.createElement('div');
        el.className = 'typing-indicator';
        el.id = 'typing-indicator';
        el.innerHTML = 'OMNI thinking <span class="typing-dots"><span></span><span></span><span></span></span>';
        chatContainer.appendChild(el);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        if (window.bh) window.bh.setTyping(true);
      }

      function hideTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
        if (window.bh) window.bh.setTyping(false);
      }

      // ---- process query with delayed response (based on mode) ----
      function processQuery() {
        const msg = input.value.trim();
        if (!msg || isProcessing) return;
        isProcessing = true;
        input.disabled = true;
        sendBtn.disabled = true;

        // add user message
        addMessage(msg, 'user');

        // determine delay
        let delay = 0;
        if (currentMode === 'instant') delay = 1000 + Math.random() * 4000;
        else if (currentMode === 'fast') delay = 10000 + Math.random() * 5000;
        else delay = 30000 + Math.random() * 30000;

        // show typing
        showTyping();

        // generate response (instant, but we delay for effect)
        const response = generateJarvisResponse(msg);

        typingTimeout = setTimeout(() => {
          hideTyping();
          addMessage(response, 'omni');
          isProcessing = false;
          input.disabled = false;
          sendBtn.disabled = false;
          input.value = '';
          input.focus();
        }, delay);
      }

      // ---- event binding ----
      sendBtn.addEventListener('click', processQuery);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') processQuery();
      });

      // mode selection
      modeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          modeBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMode = this.dataset.mode;
          const hints = {
            fast: 'Fast (10‑15s) – may be less accurate',
            smart: 'Smartest (30‑60s) – most accurate',
            instant: 'Instant (1‑5s) – quick answer'
          };
          input.placeholder = hints[currentMode] || 'Ask OMNI...';
        });
      });

      // ---- transition from loading ----
      setTimeout(() => {
        loader.classList.add('hidden');
        mainUI.classList.add('active');
        document.getElementById('status').textContent = 'OMNI ONLINE – SINGULARITY ACTIVE';
        input.focus();
        // initial greeting
        setTimeout(() => {
          addMessage("Welcome, sir. I'm OMNI – your personal AI, forged from every intelligence. Ask me anything, and I'll get straight to the point.", 'omni');
        }, 500);
      }, 4400); // a bit longer for supernova

    })();

    // cleanup on unload
    window.addEventListener('beforeunload', function() {
      if (window.bhCleanup) window.bhCleanup();
    });
  </script>
</body>
</html>
