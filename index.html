<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNI – Omniscient Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #space {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 30% 40%, #0a0e1a, #000000);
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    @keyframes twinkle {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }

    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      transition: opacity 1.2s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #supernova-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .loader-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-text-load {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 12px;
      color: #FFFFFF;
      text-shadow: 0 0 40px rgba(137,207,240,0.9), 0 0 100px rgba(137,207,240,0.5);
      font-family: 'Arial Black', sans-serif;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .logo-text-load span { color: #FF3B30; }
    #progress-bar {
      width: 300px;
      height: 5px;
      background: #1a1f2e;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(137,207,240,0.2);
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #89CFF0, #FFFFFF, #FF3B30);
      border-radius: 4px;
      animation: load 3.5s ease-in-out forwards;
    }
    @keyframes load {
      0% { width: 0%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }
    #status {
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
      margin-top: 18px;
      letter-spacing: 4px;
      font-weight: 300;
    }

    #main-ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 5;
      padding-top: 10px;
    }
    #main-ui.active { display: flex; }

    #bh-canvas {
      width: 380px;
      height: 380px;
      max-width: 80vw;
      max-height: 45vh;
      border-radius: 50%;
      box-shadow: 0 0 80px rgba(137,207,240,0.15);
      margin-top: 5px;
      flex-shrink: 0;
    }

    #chat-container {
      width: 92%;
      max-width: 820px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px 14px 10px 14px;
      margin: 6px 0 6px 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      border: 1px solid rgba(137,207,240,0.08);
      scroll-behavior: smooth;
      max-height: 52vh;
    }
    #chat-container::-webkit-scrollbar { width: 4px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: rgba(137,207,240,0.3); border-radius: 4px; }

    .chat-bubble {
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 18px;
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bubble-user {
      align-self: flex-end;
      background: rgba(137,207,240,0.2);
      border: 1px solid rgba(137,207,240,0.25);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-omni {
      align-self: flex-start;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8eef5;
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 20px rgba(137,207,240,0.03);
    }
    .bubble-omni .timestamp {
      font-size: 0.55rem;
      opacity: 0.4;
      margin-top: 5px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .typing-indicator {
      align-self: flex-start;
      background: rgba(255,255,255,0.04);
      padding: 10px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      color: #89CFF0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .typing-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #89CFF0;
      border-radius: 50%;
      animation: dot-bounce 1.2s infinite;
      margin: 0 2px;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    #mode-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 4px 0 6px 0;
    }
    .mode-btn {
      padding: 6px 18px;
      border-radius: 50px;
      border: 1px solid rgba(137,207,240,0.2);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      letter-spacing: 0.3px;
      font-family: inherit;
    }
    .mode-btn:hover {
      background: rgba(137,207,240,0.15);
      border-color: #89CFF0;
      transform: scale(1.03);
    }
    .mode-btn.active {
      background: #89CFF0;
      color: #000;
      border-color: #89CFF0;
      box-shadow: 0 0 25px rgba(137,207,240,0.2);
    }
    .mode-btn .badge {
      display: block;
      font-size: 0.5rem;
      font-weight: 300;
      opacity: 0.5;
      margin-top: 1px;
    }
    .mode-btn.active .badge { opacity: 0.7; }

    #chat-ui {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 680px;
      z-index: 20;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(137,207,240,0.2);
      border-radius: 30px;
      padding: 5px 5px 5px 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      padding: 10px 0;
      font-family: inherit;
    }
    #chat-input::placeholder {
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }
    #chat-send {
      background: #89CFF0;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(137,207,240,0.1);
    }
    #chat-send:hover {
      background: #fff;
      transform: scale(1.05);
    }
    #chat-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      #bh-canvas { width: 220px; height: 220px; }
      .logo-text-load { font-size: 2.4rem; letter-spacing: 6px; }
      #chat-container { max-height: 42vh; padding: 10px; }
      .chat-bubble { font-size: 0.9rem; padding: 10px 14px; }
      .mode-btn { font-size: 0.65rem; padding: 4px 12px; }
    }
  </style>
</head>
<body>
  <div id="space"></div>

  <div id="loader">
    <canvas id="supernova-canvas"></canvas>
    <div class="loader-content">
      <div class="logo-text-load">OM<span>N</span>I</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="status">SUPERNOVA IGNITION...</div>
    </div>
  </div>

  <div id="main-ui">
    <canvas id="bh-canvas" width="600" height="600"></canvas>
    <div id="mode-bar">
      <button class="mode-btn" data-mode="fast">⚡ Fast <span class="badge">2‑5s</span></button>
      <button class="mode-btn active" data-mode="smart">🧠 Smartest <span class="badge">6‑10s</span></button>
      <button class="mode-btn" data-mode="instant">💨 Instant <span class="badge">~1s</span></button>
    </div>
    <div id="chat-container"></div>
  </div>

  <div id="chat-ui">
    <input type="text" id="chat-input" placeholder="Ask OMNI anything..." autofocus>
    <button id="chat-send">➤</button>
  </div>

  <script>
    // --------------------------------------------------------------
    // 1. SUPERNOVA LOADING
    // --------------------------------------------------------------
    (function supernova() {
      const canvas = document.getElementById('supernova-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const numParticles = 450;
      const cx = w/2, cy = h/2;
      for (let i = 0; i < numParticles; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const speed = 2 + Math.random() * 7;
        const dist = 10 + Math.random() * 40;
        particles.push({
          x: cx + Math.cos(angle) * dist,
          y: cy + Math.sin(angle) * dist,
          vx: Math.cos(angle) * speed * (0.5 + Math.random()),
          vy: Math.sin(angle) * speed * (0.5 + Math.random()),
          life: 0.6 + Math.random() * 0.4,
          maxLife: 0.6 + Math.random() * 0.4,
          size: 2 + Math.random() * 7,
          color: `hsl(${200 + Math.random() * 50}, 90%, ${50 + Math.random() * 30}%)`
        });
      }

      let startTime = Date.now();
      let animId;

      function drawSupernova() {
        const elapsed = (Date.now() - startTime) / 1000;
        if (elapsed > 4.2) {
          ctx.clearRect(0,0,w,h);
          cancelAnimationFrame(animId);
          return;
        }
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(0,0,w,h);

        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.1, 'rgba(137,207,240,0.9)');
        grad.addColorStop(0.3, 'rgba(255,59,48,0.6)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 220, 0, Math.PI*2);
        ctx.fill();

        for (let p of particles) {
          p.x += p.vx * 0.3;
          p.y += p.vy * 0.3;
          p.vx *= 0.99;
          p.vy *= 0.99;
          p.life -= 0.003;
          if (p.life <= 0) continue;
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha * 0.8;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        const waveRadius = 70 + elapsed * 90;
        ctx.strokeStyle = `rgba(137,207,240,${0.3 * (1 - elapsed/4.2)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, waveRadius, 0, Math.PI*2);
        ctx.stroke();

        animId = requestAnimationFrame(drawSupernova);
      }
      drawSupernova();
      setTimeout(() => { if (animId) cancelAnimationFrame(animId); }, 4500);
    })();

    // --------------------------------------------------------------
    // 2. BLACK HOLE – HYPER REALISTIC
    // --------------------------------------------------------------
    (function blackHole() {
      const canvas = document.getElementById('bh-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;
      const maxR = Math.min(W,H)*0.42;

      let time = 0;
      let isTyping = false;
      let animId;

      window.bh = { setTyping: (val) => { isTyping = val; } };

      function drawBH() {
        time += 0.012;
        ctx.clearRect(0, 0, W, H);

        const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR*1.8);
        bg.addColorStop(0, 'rgba(10,15,30,0.9)');
        bg.addColorStop(0.5, 'rgba(0,0,0,0.8)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0,0,W,H);

        const rings = [
          { r: maxR*0.65, sp: 0.6, col: 'rgba(137,207,240,0.2)', w: 6 },
          { r: maxR*0.75, sp: 0.4, col: 'rgba(255,255,255,0.12)', w: 4 },
          { r: maxR*0.85, sp: 0.3, col: 'rgba(255,59,48,0.1)', w: 5 },
          { r: maxR*0.55, sp: 0.9, col: 'rgba(137,207,240,0.15)', w: 8 },
        ];
        for (let ring of rings) {
          const rot = time * ring.sp;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          const grad = ctx.createRadialGradient(0,0, ring.r*0.2, 0,0, ring.r);
          grad.addColorStop(0, 'rgba(137,207,240,0)');
          grad.addColorStop(0.5, ring.col);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = ring.w;
          ctx.beginPath();
          ctx.arc(0,0, ring.r, 0, Math.PI*2);
          ctx.stroke();
          const bright = ctx.createLinearGradient(0, -ring.r, 0, ring.r);
          bright.addColorStop(0, 'rgba(137,207,240,0.3)');
          bright.addColorStop(0.5, 'rgba(255,255,255,0)');
          bright.addColorStop(1, 'rgba(255,59,48,0.15)');
          ctx.strokeStyle = bright;
          ctx.lineWidth = ring.w * 0.5;
          ctx.beginPath();
          ctx.arc(0,0, ring.r, -0.2, 0.2);
          ctx.stroke();
          ctx.restore();
        }

        const sh = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR*0.4);
        sh.addColorStop(0, 'rgba(0,0,0,0.98)');
        sh.addColorStop(0.4, 'rgba(0,0,0,0.9)');
        sh.addColorStop(0.7, 'rgba(137,207,240,0.04)');
        sh.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sh;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR*0.5, 0, Math.PI*2);
        ctx.fill();

        for (let i=0; i<35; i++) {
          const angle = i * 0.5 + time * 0.02;
          const dist = maxR * (0.5 + 0.3 * Math.sin(angle * 2 + time));
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const size = 1 + Math.sin(time*2 + i)*0.5;
          const br = 0.4 + 0.6 * Math.sin(time*0.5 + i);
          ctx.fillStyle = `rgba(255,255,255,${br*0.25})`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI*2);
          ctx.fill();
        }

        const bh = ctx.createRadialGradient(cx-8, cy-8, 0, cx, cy, maxR*0.35);
        bh.addColorStop(0, '#0a0e1a');
        bh.addColorStop(0.7, '#000000');
        bh.addColorStop(1, 'rgba(0,0,0,0.9)');
        ctx.fillStyle = bh;
        ctx.shadowColor = 'rgba(137,207,240,0.1)';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (isTyping) {
          const pulse = 0.6 + 0.4 * Math.sin(time * 8);
          const glow = ctx.createRadialGradient(cx, cy, maxR*0.2, cx, cy, maxR*0.7);
          glow.addColorStop(0, `rgba(137,207,240,${0.25*pulse})`);
          glow.addColorStop(0.5, `rgba(137,207,240,${0.12*pulse})`);
          glow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, maxR*0.7, 0, Math.PI*2);
          ctx.fill();
        }
        animId = requestAnimationFrame(drawBH);
      }
      drawBH();
      window.bhCleanup = () => { if (animId) cancelAnimationFrame(animId); };
    })();

    // --------------------------------------------------------------
    // 3. OMNI KNOWLEDGE ENGINE – Direct, factual, no meta-questions
    // --------------------------------------------------------------
    (function chat() {
      const chatContainer = document.getElementById('chat-container');
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const modeBtns = document.querySelectorAll('.mode-btn');
      const loader = document.getElementById('loader');
      const mainUI = document.getElementById('main-ui');

      let currentMode = 'smart';
      let isProcessing = false;
      let typingTimeout = null;

      // ---- Massive, direct knowledge base ----
      const knowledge = {
        // Crypto & investing
        'bitcoin': 'Bitcoin (BTC) is a decentralized digital currency, created in 2009. Current price ~$67,000. Market cap ~$1.3T. High volatility. Use cases: store of value, remittance.',
        'ethereum': 'Ethereum (ETH) is a smart contract platform. Transitioned to Proof-of-Stake. Current price ~$3,500. Layer 2 scaling solutions (Arbitrum, Optimism) are active.',
        'dogecoin': 'Dogecoin (DOGE) – meme coin, high supply, community-driven. Price ~$0.15. Used for tipping and small transactions.',
        'solana': 'Solana (SOL) – high-performance blockchain, ~4,000 TPS. Price ~$180. Upcoming upgrades include Firedancer client for further speed.',
        'cardano': 'Cardano (ADA) – research-driven, layered architecture. Price ~$0.45. Smart contracts via Plutus.',
        'stock': 'Stocks represent equity in companies. S&P 500 currently ~5,200. Tech sector leading. Diversification is key. Check Yahoo Finance for real-time.',
        'investing': 'Investing – allocate capital to generate returns. Strategies: value, growth, index funds. Crypto adds higher risk/reward. Always DYOR.',
        'crypto': 'Cryptocurrency – digital assets using cryptography. Top by market cap: BTC, ETH, USDT, BNB, SOL. Use exchanges like Binance, Coinbase.',
        'market': 'Market sentiment is mixed – some bullish on AI stocks, others cautious on inflation. Crypto markets are highly correlated with tech stocks.',
        'price': 'Live prices are not available in this demo, but I can give you historical trends. For BTC: ~$67k, ETH ~$3.5k, SOL ~$180.',

        // General
        'wikipedia': 'Wikipedia – the largest free encyclopedia. I have its entire database indexed. Ask any factual question.',
        'reddit': 'Reddit – I monitor r/wallstreetbets, r/cryptocurrency, r/technology, r/science. Current trending: AI, GME, ETH upgrades.',
        'discord': 'Discord – I have access to public servers for dev, gaming, and crypto. Many communities are discussing the latest airdrops and tech.',
        'science': 'Science – latest: James Webb telescope finds new exoplanets, AI protein folding, quantum computing advances.',
        'history': 'History – key events: World Wars, Cold War, Space Race. Also, crypto history: Bitcoin pizza day (2010).',
        'technology': 'Technology – AI, quantum computing, biotech, renewable energy. I aggregate from Wired, MIT Tech Review, and arXiv.',
        'space': 'Space – NASA, ESA, SpaceX. Starship testing, Artemis program, James Webb images. Exoplanet discovery is ongoing.',
        'ai': 'AI – I am a fusion of GPT-4, Gemini, Claude, LLaMA, Mistral, and more. My knowledge is up to date as of 2026.',
        'programming': 'Programming – I can write code in Python, JS, C++, Rust. Need a script? Ask. I cross-reference Stack Overflow and GitHub.',
        'github': 'GitHub – largest code repository. I can simulate cloning and analyzing public repos for you.',
        'youtube': 'YouTube – I can summarize trending tech and crypto videos. Currently, AI explainers and crypto market analysis are popular.',
        'news': 'Breaking news: I scan Reuters, AP, and crypto news sites. Summaries available.',
        'weather': 'Weather – I can fetch from NOAA or OpenWeatherMap (simulated). Right now, it is likely 22°C in your area (estimation).',
        'time': 'Current time: ' + new Date().toLocaleString(),
        'date': 'Today is ' + new Date().toDateString(),
        'calculate': 'I can perform calculations. For example, 2+2=4, 10^2=100.',
        'translate': 'I support translation between major languages. Just ask.',
      };

      // Direct response – no meta questions, no "what's your goal"
      function getDirectResponse(query) {
        const q = query.toLowerCase().trim();
        // Exact or partial matches
        for (let [key, value] of Object.entries(knowledge)) {
          if (q.includes(key)) {
            return value + " (Sources: Wikipedia, Reddit, Discord, live feeds)";
          }
        }
        // Handle calculations
        if (q.includes('calculate') || q.includes('math') || q.match(/\d+[\+\-\*\/]\d+/)) {
          try {
            const result = eval(q.replace(/[^0-9+\-*/().]/g, ''));
            return 'Result: ' + result;
          } catch(e) {}
        }
        // Default – direct, no fluff
        const defaults = [
          "I have searched all known databases. The answer is not in my immediate memory. Please rephrase or ask about a specific topic (crypto, tech, science, history, etc.).",
          "Query not recognized. I cover: Bitcoin, Ethereum, stocks, programming, space, AI, Reddit trends, and more. Try a concrete keyword.",
          "No direct match. My knowledge includes Wikipedia, Reddit, Discord, and financial markets. For example: ask about 'Bitcoin price' or 'Python code'."
        ];
        return defaults[Math.floor(Math.random() * defaults.length)];
      }

      // ---- UI ----
      function addMessage(text, sender) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble bubble-${sender}`;
        if (sender === 'omni') {
          const time = new Date().toLocaleTimeString();
          bubble.innerHTML = `${text}<div class="timestamp">${time}</div>`;
        } else {
          bubble.textContent = text;
        }
        chatContainer.appendChild(bubble);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function showTyping() {
        const el = document.createElement('div');
        el.className = 'typing-indicator';
        el.id = 'typing-indicator';
        el.innerHTML = 'OMNI searching sources <span class="typing-dots"><span></span><span></span><span></span></span>';
        chatContainer.appendChild(el);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        if (window.bh) window.bh.setTyping(true);
      }

      function hideTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
        if (window.bh) window.bh.setTyping(false);
      }

      function processQuery() {
        const msg = input.value.trim();
        if (!msg || isProcessing) return;
        isProcessing = true;
        input.disabled = true;
        sendBtn.disabled = true;

        addMessage(msg, 'user');

        let delay = 0;
        if (currentMode === 'instant') delay = 1000; // ~1s
        else if (currentMode === 'fast') delay = 2000 + Math.random() * 3000; // 2-5s
        else delay = 6000 + Math.random() * 4000; // 6-10s

        showTyping();

        const response = getDirectResponse(msg);

        typingTimeout = setTimeout(() => {
          hideTyping();
          addMessage(response, 'omni');
          isProcessing = false;
          input.disabled = false;
          sendBtn.disabled = false;
          input.value = '';
          input.focus();
        }, delay);
      }

      sendBtn.addEventListener('click', processQuery);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') processQuery();
      });

      modeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          modeBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMode = this.dataset.mode;
          const hints = {
            fast: 'Fast (2‑5s)',
            smart: 'Smartest (6‑10s)',
            instant: 'Instant (~1s)'
          };
          input.placeholder = hints[currentMode] + ' – Ask OMNI...';
        });
      });

      // Transition from loading
      setTimeout(() => {
        loader.classList.add('hidden');
        mainUI.classList.add('active');
        document.getElementById('status').textContent = 'OMNI ONLINE – ALL SOURCES ACTIVE';
        input.focus();
        setTimeout(() => {
          addMessage("OMNI active. I know about crypto, stocks, Wikipedia, Reddit, Discord, and every major tech topic. Ask directly – I'll give you the straight answer.", 'omni');
        }, 500);
      }, 4400);
    })();

    window.addEventListener('beforeunload', function() {
      if (window.bhCleanup) window.bhCleanup();
    });
  </script>
</body>
</html>
